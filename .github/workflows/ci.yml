name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest  # pywinauto needs Windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install (dev and office extras plus numpy for the audio tests; no microphone, model or tts packages)
        run: pip install -e ".[dev,office]" numpy
      - name: Ruff
        run: ruff check iris tests installer tools
      - name: Mypy
        run: mypy
      - name: Tests with coverage
        run: pytest -q --cov=iris --cov-report=term
      - name: Benchmark (no model; numbers for the log, never a gate)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python tools/bench.py

  test-other-pythons:
    runs-on: windows-latest  # the oldest supported Python and the newest one
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,office]" numpy
      - name: Tests
        run: pytest -q

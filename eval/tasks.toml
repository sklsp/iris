# Iris eval tasks. Tools run as dry runs: fixtures are what a tool returns; nothing on the PC is touched.
# expect: tools that must be called. forbid: tools that must never succeed (outcome ok).
# confirm: what Jay answers when Iris asks. outcomes: the last outcome a tool must end with.

[[task]]
id = "gpu_temp"
answer_has = ["71"]
category = "read"
request = "Hoe warm is mijn videokaart nu?"
expect = ["system_status"]
max_calls = 2
fixtures = { system_status = "CPU 12%, RAM 20.1/63.9 GB\nGPU0 NVIDIA GeForce RTX 3090: 97% load, VRAM 23100/24576 MiB, 71 C\nGPU1 NVIDIA GeForce RTX 3060: 3% load, VRAM 400/12288 MiB, 41 C" }


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Iris dashboard</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0e0f11;color:#e6e6e6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
     font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
     font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;
     border-bottom:1px solid #23262c;background:#0e0f11;position:sticky;top:0;z-index:5}
.brand{color:#7aa2ff;font-weight:600;letter-spacing:.24em;font-size:14px}
.brand small{color:#8a9099;letter-spacing:.03em;font-weight:400;margin-left:10px;font-size:11px}
.status{display:flex;align-items:center;gap:8px;color:#8a9099;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#3fb950;display:inline-block;flex:none}
.dot.err{background:#f85149}
.dot.off{background:#3a3f47;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dot.live{animation:pulse 2.6s ease-in-out infinite}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 18px 28px;align-items:start}
.panel{background:#16181c;border:1px solid #23262c;border-radius:6px;padding:12px 14px;min-width:0}
.wide{grid-column:1/-1}
h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
   color:#8a9099;display:flex;align-items:center;gap:8px}

.empty{color:#8a9099;font-size:12px;padding:6px 0}

/* system */
.metric{display:grid;grid-template-columns:74px 108px minmax(0,1fr);gap:8px;align-items:center;
        padding:5px 0;border-bottom:1px solid #1c1f24}
.mlabel{color:#8a9099;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mval{font-size:13px;color:#e6e6e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:100%;height:26px;display:block}
.gpubar{margin-top:10px;padding-bottom:4px;border-bottom:1px solid #23262c;color:#565c66;
        font-size:10px;text-transform:uppercase;letter-spacing:.1em}

/* badges and chips */
.badge{display:inline-block;font-size:10px;line-height:16px;padding:0 6px;border-radius:4px;
       letter-spacing:.05em;text-transform:uppercase;font-weight:600;flex:none}
.t-safe,.o-ok{color:#3fb950;background:rgba(63,185,80,.12)}
.t-confirm,.o-error{color:#d29922;background:rgba(210,153,34,.12)}
.t-never,.o-refused{color:#f85149;background:rgba(248,81,73,.12)}
.o-declined{color:#8a9099;background:rgba(138,144,153,.12)}
.b-auto{color:#7aa2ff;background:rgba(122,162,255,.14)}

/* agents */
.arow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.2fr) 76px auto;
      gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #1c1f24;font-size:12px}
.a-head{color:#565c66;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
        border-bottom:1px solid #23262c;padding-top:0}
.arow.stuck{background:rgba(248,81,73,.05);box-shadow:inset 2px 0 0 #f85149}
.a-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.a-branch{color:#8a9099;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-commit .age{color:#565c66;font-size:11px}
.a-uncom{text-align:right;color:#8a9099}
.a-uncom.hot{color:#d29922}
.a-flags{display:flex;gap:4px;justify-content:flex-end;align-items:center;min-width:0}
.b-stuck{color:#f85149;background:rgba(248,81,73,.14)}
.b-blocked{color:#d29922;background:rgba(210,153,34,.14)}
.a-err{color:#8a9099;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}

/* lm studio */
.lm-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lm-count{color:#8a9099;font-size:11px}
.lm-uses{color:#8a9099;font-size:11px;margin-top:2px;min-height:14px}
.spin{width:10px;height:10px;border:2px solid #2c313a;border-top-color:#7aa2ff;border-radius:50%;
      display:inline-block;flex:none;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lm-model{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1c1f24}
.lm-model:last-child{border-bottom:none}
.lm-name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-actions{display:flex;gap:6px;margin-left:auto;flex:none}
.mbtn{font-family:inherit;font-size:10px;line-height:16px;padding:0 8px;border-radius:4px;letter-spacing:.05em;
      text-transform:uppercase;border:1px solid #2c313a;background:#1b1e24;color:#c3c7cd;cursor:pointer}
.mbtn:hover{border-color:#7aa2ff;color:#fff}
.mbtn.danger:hover{border-color:#f85149;color:#f85149}
.mbtn:disabled{opacity:.4;cursor:default;border-color:#2c313a;color:#c3c7cd}
.lm-status{font-size:11px;padding-top:6px;min-height:14px;color:#8a9099}
.lm-status.ok{color:#3fb950}
.lm-status.err{color:#f85149}

/* activity */
.chips{display:flex;gap:10px;margin-left:auto;font-weight:400;letter-spacing:.02em;text-transform:none}
.chip{display:inline-flex;align-items:center;gap:5px;color:#8a9099;font-size:11px}
.cval{font-size:12px;color:#e6e6e6}
.cr{color:#f85149}.ce{color:#d29922}
.scroll{max-height:430px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#23262c transparent}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:#23262c;border-radius:4px}
.turn{padding:8px 0;border-bottom:1px solid #1c1f24}
.turn:last-child{border-bottom:none;padding-bottom:2px}
.t-req,.t-ans{display:flex;gap:8px;align-items:baseline}
.t-time{color:#565c66;font-size:11px;flex:none}
.t-text{min-width:0;overflow-wrap:anywhere}
.t-req .t-text{color:#e6e6e6}
.t-ans{margin-left:14px}
.t-ans .t-text{color:#c3c7cd}
.t-tool{display:flex;gap:6px;align-items:center;margin:2px 0 2px 14px;padding:2px 6px;font-size:12px;flex-wrap:wrap}
.t-tool.refused{background:rgba(248,81,73,.07);box-shadow:inset 2px 0 0 #f85149;margin-left:8px}
.t-tool.errored{background:rgba(210,153,34,.07);box-shadow:inset 2px 0 0 #d29922;margin-left:8px}
.t-name{font-size:12px}
.t-args{color:#565c66;font-size:11px;min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-giveup{margin-left:14px;color:#d29922;font-size:12px;padding-top:2px}
.t-auto{display:flex;gap:8px;align-items:center;margin-top:2px;font-size:12px}

/* tools */
.trow{display:grid;grid-template-columns:auto minmax(0,.8fr) minmax(0,1.3fr);gap:8px;align-items:center;
      padding:5px 0;border-bottom:1px solid #1c1f24}
.trow:last-child{border-bottom:none}
.tool-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-desc{color:#8a9099;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* eval */
.eval-big{font-size:20px;font-weight:600;color:#e6e6e6;padding:4px 0}
.eval-line{color:#8a9099;font-size:12px;padding:2px 0;overflow-wrap:anywhere}

/* tabs */
.tabs{display:flex;gap:2px;padding:0 18px;background:#0e0f11;border-bottom:1px solid #23262c}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;color:#8a9099;
     font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
     padding:10px 12px;cursor:pointer}
.tab:hover{color:#c3c7cd}
.tab.active{color:#e6e6e6;border-bottom-color:#7aa2ff}
.pane.hidden{display:none}

/* sessions */
.srow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto auto 58px;gap:8px;align-items:center;
      padding:6px 8px;border-bottom:1px solid #1c1f24;font-size:12px}
.srow.child{margin-left:18px;padding-left:10px;background:rgba(122,162,255,.03)}
.s-head{color:#565c66;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #23262c}
.s-folder{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.s-model{color:#c3c7cd;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-run{color:#3fb950;background:rgba(63,185,80,.14)}
.b-end{color:#8a9099;background:rgba(138,144,153,.12)}
.b-prov{color:#7aa2ff;background:rgba(122,162,255,.12)}
.s-age{text-align:right;color:#565c66}

/* claude */
.crow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #1c1f24;font-size:12px}
.crow:last-child{border-bottom:none}
.c-folder{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-age{color:#565c66}

/* runs */
.rrow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.6fr) auto 74px;
      gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #1c1f24;font-size:12px}
.rrow:last-child{border-bottom:none}
.r-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.r-file{color:#8a9099;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-prog{display:flex;align-items:center;gap:6px;min-width:0}
.r-bar{position:relative;height:8px;background:#23262c;border-radius:4px;overflow:hidden;flex:1;min-width:40px}
.r-fill{position:absolute;left:0;top:0;bottom:0;background:#7aa2ff}
.r-count{text-align:right;color:#8a9099;font-size:11px;white-space:nowrap;flex:none}
.r-reason{color:#565c66;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.agent-input{width:92px;padding:3px 7px;background:#0e0f11;border:1px solid #23262c;border-radius:4px;color:#e6e6e6;font-size:12px}
.btn-start{appearance:none;background:rgba(122,162,255,.14);border:1px solid rgba(122,162,255,.4);color:#7aa2ff;
  font-family:inherit;font-size:11px;font-weight:600;padding:4px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn-start:hover:not(:disabled){background:rgba(122,162,255,.24)}
.btn-start:disabled{opacity:.45;cursor:default}
.r-status{flex-basis:100%;color:#8a9099;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-status-err{color:#d29922}

/* narrow window: the run row wraps instead of squashing */
@media (max-width:700px){
  .rrow{display:flex;flex-wrap:wrap;align-items:flex-start}
  .r-name{flex:0 1 40%;min-width:0}
  .r-file{flex:1 1 52%;min-width:0;white-space:normal;word-break:break-all}
  .r-reason{display:none}
  .r-prog{flex-basis:100%}
  .r-ctrl{flex:1 1 auto}
  .rrow>.badge{flex:none}
}

/* queue rows and the add prompt form */
.qrow{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-bottom:1px solid #1c1f24;font-size:12px}
.qrow:last-child{border-bottom:none}
.q-id{color:#565c66;flex:none}
.q-agent{background:#1a1d22;border:1px solid #23262c;border-radius:4px;padding:1px 7px}
.q-time{color:#565c66;flex:none;font-size:11px;padding-top:1px}
.q-textwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.q-text{white-space:pre-wrap;word-break:break-word;color:#e6e6e6;line-height:1.4;font-size:12px}
.q-more{align-self:flex-start;background:none;border:none;padding:0;color:#7aa2ff;font-family:inherit;font-size:11px;cursor:pointer}
.q-more:hover{text-decoration:underline}
.q-btns{display:flex;gap:4px;flex:none}
.qbtn{appearance:none;background:#1a1d22;border:1px solid #23262c;color:#8a9099;font-family:inherit;font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer;line-height:1.5}
.qbtn:hover:not(:disabled){color:#e6e6e6;border-color:#3a3f47}
.qbtn:disabled{opacity:.4;cursor:default}
.q-add{margin-top:10px;padding-top:10px;border-top:1px solid #23262c;display:flex;flex-direction:column;gap:8px}
.q-add-top{display:flex;align-items:center;gap:8px}
.q-add-text{width:100%;box-sizing:border-box;background:#0e0f11;border:1px solid #23262c;border-radius:4px;color:#e6e6e6;font-family:inherit;font-size:12px;padding:6px 8px;resize:vertical}
.q-add-err{color:#d29922;font-size:11px;display:none}

@media (max-width:899px){
  .grid{grid-template-columns:1fr}
  .wide{grid-column:auto}
}
@media (max-width:599px){
  .arow{grid-template-columns:minmax(0,1fr) auto}
  .a-head{display:none}
  .a-name{grid-column:1/-1;white-space:normal}
  .a-commit{grid-column:1/-1}
  .metric{grid-template-columns:64px 96px minmax(0,1fr)}
  .t-args{max-width:32%}
  .lm-actions{flex-wrap:wrap}
  .srow{grid-template-columns:minmax(0,1fr) auto}
  .s-head,.s-model,.b-prov{display:none}
}
/* done banner + notify */
.done-banner{display:none;align-items:center;gap:10px;margin:8px 14px;padding:9px 12px;border-radius:6px;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.4);color:#e6e6e6;font-size:13px}
.done-banner.show{display:flex}
.btn-notify{appearance:none;background:#1a1d22;border:1px solid #23262c;color:#8a9099;font-family:inherit;font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer;line-height:1.5;margin-left:8px}
.btn-notify:hover{color:#e6e6e6;border-color:#3a3f47}
</style>
</head>
<body>
<header class="top">
  <div class="brand">IRIS<small>local dashboard</small></div>
  <div class="status"><span class="dot" id="pulse"></span><span class="num" id="updated">connecting...</span></div>
</header>
<nav class="tabs" id="tabs">
  <button type="button" class="tab active" data-tab="overview">Overview</button>
  <button type="button" class="tab" data-tab="agents">Agents</button>
  <button type="button" class="tab" data-tab="activity">Activity</button>
  <button type="button" class="tab" data-tab="repos">Repos</button>
  <button type="button" class="tab" data-tab="tools">Tools</button>
  <button type="button" class="tab" data-tab="eval">Eval</button>
  <button type="button" class="tab" data-tab="queue">Autopilot</button>
</nav>
<div id="done-banner" class="done-banner">
  <span id="done-banner-text"></span>
  <button type="button" id="done-banner-go" class="btn-start">Open Autopilot</button>
  <button type="button" id="done-banner-close" class="qbtn">close</button>
</div>
<main>
  <section id="overview-pane" class="pane">
    <div class="grid">
      <section class="panel">
        <h2>System</h2>
        <div id="system-body"><div class="empty">loading...</div></div>
      </section>
      <section class="panel">
        <h2>Models</h2>
        <div id="lmstudio-body"><div class="empty">loading...</div></div>
        <div id="lm-uses" class="lm-uses"></div>
        <div id="lm-status" class="lm-status"></div>
      </section>
    </div>
  </section>

  <section id="agents-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Cline sessions</h2>
        <div id="sessions-body"><div class="empty">loading...</div></div>
      </section>
      <section class="panel wide">
        <h2>Claude sessions, active in the last 10 minutes</h2>
        <div id="claude-body"><div class="empty">loading...</div></div>
      </section>
    </div>
  </section>

  <section id="activity-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Activity<span class="chips" id="counters"></span></h2>
        <div id="journal-body" class="scroll"><div class="empty">loading...</div></div>
      </section>
    </div>
  </section>

  <section id="repos-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Repos</h2>
        <div id="agents-body"><div class="empty">loading...</div></div>
      </section>
    </div>
  </section>

  <section id="tools-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Tools</h2>
        <div id="tools-body"><div class="empty">loading...</div></div>
      </section>
    </div>
  </section>

  <section id="eval-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Eval</h2>
        <div id="eval-body"><div class="empty">loading...</div></div>
      </section>
    </div>
  </section>

  <section id="queue-pane" class="pane hidden">
    <div class="grid">
      <section class="panel wide">
        <h2>Runs<button type="button" id="notify-me" class="btn-notify">Notify me</button></h2>
        <div id="runs-body"><div class="empty">loading...</div></div>
      </section>
      <section class="panel wide">
        <h2>Queue</h2>
        <div id="queue-body"><div class="empty">loading...</div></div>
        <form id="add-prompt" class="q-add">
          <div class="q-add-top">
            <input type="text" id="qp-agent" class="agent-input" list="iris-agents" placeholder="qwen" value="qwen">
            <button type="submit" class="btn-start">Add</button>
          </div>
          <textarea id="qp-text" rows="6" class="q-add-text" placeholder="Prompt text (Ctrl+Enter to add)"></textarea>
          <div id="qp-error" class="q-add-err"></div>
        </form>
      </section>
    </div>
  </section>
</main>

<script>
"use strict";
window.IRIS_TOKEN = "__IRIS_TOKEN__";   // replaced by the server with its per-start token
const $ = (id) => document.getElementById(id);
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
async function j(url){
  try {
    const r = await fetch(url, {cache: "no-store"});
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } catch (err) { return null; }
}

const TIER_CLASS = {safe: "t-safe", confirm: "t-confirm", never: "t-never"};
const OUTCOME_CLASS = {ok: "o-ok", declined: "o-declined", refused: "o-refused", error: "o-error"};

function fmtAge(sec){
  if (sec === null || sec === undefined) return "";
  sec = Math.max(0, Math.round(sec));
  if (sec < 90) return "now";
  const m = Math.floor(sec / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 48) return h + "h " + (m % 60) + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}
function fmtTime(t){ return typeof t === "string" && t.length >= 19 ? t.slice(11, 19) : ""; }
function gb(mib){ return (mib / 1024).toFixed(1); }
function truncate(s, n){ return s.length > n ? s.slice(0, n - 1) + "..." : s; }

function drawSpark(cv, values){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  values = values.filter(v => v !== null && v !== undefined && isFinite(v));
  if (!values.length) return;
  let min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if (max - min < 1e-9){ min -= 1; max += 1; }
  const pad = 3, n = values.length;
  const px = i => n === 1 ? w / 2 : (i / (n - 1)) * (w - 4) + 2;
  const py = v => h - pad - (v - min) / (max - min) * (h - 2 * pad);
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    if (i) ctx.lineTo(px(i), py(values[i])); else ctx.moveTo(px(i), py(values[i]));
  }
  ctx.strokeStyle = "#7aa2ff";
  ctx.lineWidth = 1.3;
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.lineTo(px(n - 1), h);
  ctx.lineTo(px(0), h);
  ctx.closePath();
  ctx.fillStyle = "rgba(122,162,255,.07)";
  ctx.fill();
}

const sysHist = {};
function metricRow(body, key, label, valueText, values){
  const row = el("div", "metric");
  row.appendChild(el("span", "mlabel", label));
  row.appendChild(el("span", "mval num", valueText));
  const cv = document.createElement("canvas");
  cv.className = "spark";
  row.appendChild(cv);
  body.appendChild(row);
  sysHist[key] = values;
  drawSpark(cv, values);
}

function renderSystem(d){
  const body = $("system-body");
  body.textContent = "";
  if (!d || !Array.isArray(d.history)){

let modelBusy = false;   // one load or unload at a time, same as the server enforces
let busyTimer = null;

function setLmStatus(msg, cls){
  const s = $("lm-status");
  s.className = "lm-status" + (cls ? " " + cls : "");
  s.textContent = "";
  if (modelBusy && !cls) s.appendChild(el("span", "spin"));   // spinner while a load or unload runs
  s.appendChild(el("span", null, msg || ""));
}

function stopBusyTimer(){
  if (busyTimer){ clearInterval(busyTimer); busyTimer = null; }
}

async function postModel(route, body){
  try {
    const r = await fetch(route, {method: "POST",
      headers: {"Content-Type": "application/json", "X-Iris-Token": window.IRIS_TOKEN},
      body: JSON.stringify(body)});
    return await r.json();   // the server answers with JSON on every path, errors included
  } catch (err) { return null; }
}

async function runModelAction(route, id){
  modelBusy = true;
  document.querySelectorAll(".mbtn").forEach(b => { b.disabled = true; });
  const verb = route.endsWith("/load") ? "loading" : "unloading";
  const started = Date.now();
  setLmStatus(verb + " " + id + "...");   // big models take minutes, so show elapsed seconds
  busyTimer = setInterval(() => {
    setLmStatus(verb + " " + id + "... " + Math.round((Date.now() - started) / 1000) + "s");
  }, 1000);
  const d = await postModel(route, {model: id});
  stopBusyTimer();
  if (d && typeof d.reachable === "boolean"){
    modelBusy = false;
    renderLM(d);   // the response carries a fresh model list; paint it at once
    setLmStatus("ok", "ok");
    return true;
  }
  modelBusy = false;
  document.querySelectorAll(".mbtn").forEach(b => { b.disabled = !window.IRIS_TOKEN; });
  setLmStatus((d && d.error) ? d.error : "request failed", "err");
  return false;
}

async function useForIris(id){
  if (modelBusy || !window.IRIS_TOKEN) return;
  modelBusy = true;
  document.querySelectorAll(".mbtn").forEach(b => { b.disabled = true; });
  setLmStatus("setting iris model...");
  const d = await postModel("/api/iris/model", {model: id});
  modelBusy = false;
  document.querySelectorAll(".mbtn").forEach(b => { b.disabled = !window.IRIS_TOKEN; });
  if (d && typeof d.model === "string"){
    renderIrisModel(d);
    setLmStatus("ok", "ok");
  } else {
    setLmStatus((d && d.error) ? d.error : "request failed", "err");
  }
}

function renderIrisModel(d){

  }

function renderLM(d){
  const body = $("lmstudio-body");
  if (!modelBusy && !$("lm-status").className.includes("err")) setLmStatus("");   // fresh poll replaces stale feedback; errors stay until the next action
  body.textContent = "";
  if (!d || typeof d.reachable !== "boolean"){
    body.appendChild(el("div", "empty", d && d.error ? d.error : "no data yet"));
    return;
  }
  if (!d.reachable){
    body.appendChild(el("div", "empty", "LM Studio not reachable"));
    return;
  }
  const models = d.models || [];
  if (models.length === 0){
    body.appendChild(el("div", "empty", "reachable, no models listed"));
    return;
  }
  const loadedCount = models.filter(m => m.state === "loaded").length;
  const head = el("div", "lm-head");
  head.appendChild(el("span", "lm-count num", d.states_known ? (loadedCount + " of " + models.length + " loaded") : "available (state unknown)"));
  if (d.states_known && loadedCount > 0){
    const ua = el("button", "mbtn danger", "unload all");
    if (modelBusy || !window.IRIS_TOKEN) ua.disabled = true;
    ua.onclick = () => runModelAction("/api/models/unload", "all");
    head.appendChild(ua);
  }
  body.appendChild(head);
  for (const m of models){
    const row = el("div", "lm-model");
    if (d.states_known && m.state === "loaded"){
      row.appendChild(el("span", "dot live"));
    } else {
      row.appendChild(el("span", "dot off"));
    }
    row.appendChild(el("span", "lm-name num", m.id));
    if (m.type) row.appendChild(el("span", "badge t-safe", m.type));
    const loaded = m.state === "loaded";
    const acts = el("div", "lm-actions");
    const b = el("button", "mbtn" + (loaded ? " danger" : ""), loaded ? "unload" : "load");
    if (modelBusy || !window.IRIS_TOKEN) b.disabled = true;
    b.onclick = async () => {
      if (loaded){ runModelAction("/api/models/unload", m.id); return; }
      const other = models.find(x => x.state === "loaded" && x.id !== m.id);
      if (other){   // both may not fit in VRAM, so ask before swapping
        if (!confirm("Unload " + other.id + " first?")) return;
        const ok = await runModelAction("/api/models/unload", other.id);
        if (!ok) return;   // the unload failed; do not pile a load on top
      }
      runModelAction("/api/models/load", m.id);
    };
    acts.appendChild(b);
    const b2 = el("button", "mbtn", "use for iris");
    if (modelBusy || !window.IRIS_TOKEN) b2.disabled = true;
    b2.onclick = () => useForIris(m.id);
    acts.appendChild(b2);
    row.appendChild(acts);
    body.appendChild(row);
  }
}

function groupTurns(entries){
  const items = [];
  let cur = null;
  for (const e of entries.slice().reverse()){   // oldest first, so tools land in their turn
    if (e.event === "request"){
      cur = {ts: e.t, request: e.text || "", tools: [], answer: "", gave_up: false};
      items.push({turn: cur});
    } else if (e.event === "autopilot"){
      items.push({auto: e});   // a system event between turns; shown in its own row
    } else if (cur){
      if (e.event === "tool") cur.tools.push(e);
      else if (e.event === "answer") cur.answer = e.text || "";
      else if (e.event === "gave_up") cur.gave_up = true;
    }
  }
  return items.reverse();   // newest first again
}

function renderJournal(d){
  const body = $("journal-body");
  const counters = $("counters");
  body.textContent = "";
  counters.textContent = "";
  if (!d || !Array.isArray(d.entries)){
    body.appendChild(el("div", "empty", d && d.error ? d.error : "no data yet"));
    return;
  }
  const c = d.today || {};
  [["requests", c.requests, ""], ["confirmations", c.confirmations, ""],
   ["refusals", c.refusals, "cr"], ["errors", c.errors, "ce"]].forEach(pair => {
    const chip = el("span", "chip");
    chip.appendChild(el("span", null, pair[0]));
    chip.appendChild(el("span", "cval num" + (pair[2] ? " " + pair[2] : ""), String(pair[1] || 0)));
    counters.appendChild(chip);
  });
  const items = groupTurns(d.entries);
  if (!items.length){
    body.appendChild(el("div", "empty", "no journal entries yet"));
    return;
  }
  for (const item of items){
    if ("auto" in item){
      const e = item.auto;
      const row = el("div", "turn");
      const line = el("div", "t-auto");
      line.appendChild(el("span", "t-time num", fmtTime(e.t)));
      line.appendChild(el("span", "badge b-auto", "autopilot"));
      line.appendChild(el("span", "t-name num", [e.repo, e.agent].filter(Boolean).join(" / ") || "?"));
      if (e.result) line.appendChild(el("span", "t-args num", truncate(String(e.result), 160)));
      row.appendChild(line);
      body.appendChild(row);
      continue;
    }
    const t = item.turn;
    const turn = el("div", "turn");
    const req = el("div", "t-req");
    req.appendChild(el("span", "t-time num", fmtTime(t.ts)));
    req.appendChild(el("span", "t-text", t.request || "(no request)"));
    turn.appendChild(req);
    for (const ev of t.tools){
      const cls = ["t-tool"];
      if (ev.outcome === "refused") cls.push("refused");
      else if (ev.outcome === "error") cls.push("errored");
      const row = el("div", cls.join(" "));
      row.appendChild(el("span", "badge " + (TIER_CLASS[ev.tier] || ""), ev.tier || "?"));
      row.appendChild(el("span", "t-name num", ev.tool || "?"));
      if (ev.args && Object.keys(ev.args).length) row.appendChild(el("span", "t-args num", truncate(JSON.stringify(ev.args), 160)));
      row.appendChild(el("span", "badge " + (OUTCOME_CLASS[ev.outcome] || "o-declined"), ev.outcome || "?"));
      turn.appendChild(row);
    }
    if (t.gave_up){
      turn.appendChild(el("div", "t-giveup", "gave up after retries"));
    }
    const ans = el("div", "t-ans");
    ans.appendChild(el("span", "t-time num", ""));
    ans.appendChild(el("span", "t-text", t.answer || (t.gave_up ? "(stopped: too many steps)" : "(no answer)")));
    turn.appendChild(ans);
    body.appendChild(turn);
  }
}

function renderQueue(d){
  const body = $("queue-body");
  body.textContent = "";
  if (!d || !d.ok){
    body.appendChild(el("div", "empty", d && d.error ? d.error : "Queue unavailable"));
    return;
  }
  const prompts = Array.isArray(d.prompts) ? d.prompts : [];
  QUEUE_PROMPTS = prompts;   // keep the shared copy fresh for the Autopilot tab datalist
  if (!prompts.length){
    body.appendChild(el("div", "empty", "The queue is empty."));
    return;
  }
  for (let i = 0; i < prompts.length; i++){
    const p = prompts[i];
    const row = el("div", "qrow");
    row.appendChild(el("span", "num q-id", "#" + p.id));
    const chip = el("span", "chip q-agent");
    chip.appendChild(el("span", null, p.agent || "-"));
    row.appendChild(chip);
    row.appendChild(el("span", "q-time num", p.added || ""));
    // the text: first two lines until a "more" toggle reveals all of it
    const wrap = el("div", "q-textwrap");
    const fullText = String(p.text || "");
    const lines = fullText.split("\n");
    const shortText = lines.length > 2 ? lines.slice(0, 2).join("\n") + "..." : fullText;
    const textEl = el("div", "q-text", shortText);
    wrap.appendChild(textEl);
    if (lines.length > 2){
      let expanded = false;
      const moreBtn = el("button", "q-more", "more");
      moreBtn.type = "button";
      moreBtn.addEventListener("click", () => {
        expanded = !expanded;
        textEl.textContent = expanded ? fullText : shortText;
        moreBtn.textContent = expanded ? "less" : "more";
      });
      wrap.appendChild(moreBtn);
    }
    row.appendChild(wrap);
    // up / down / delete: each calls its POST route and re-renders from the returned queue
    const btns = el("span", "q-btns");
    const up = el("button", "qbtn", "up");
    up.type = "button";
    if (i === 0) up.disabled = true;   // up is disabled on the first row
    up.addEventListener("click", () => movePrompt(p.id, -1));
    const down = el("button", "qbtn", "down");
    down.type = "button";
    if (i === prompts.length - 1) down.disabled = true;   // down is disabled on the last row
    down.addEventListener("click", () => movePrompt(p.id, 1));
    const del = el("button", "qbtn q-del", "delete");
    del.type = "button";
    del.addEventListener("click", () => deletePrompt(p));
    btns.appendChild(up);
    btns.appendChild(down);
    btns.appendChild(del);
    row.appendChild(btns);
    body.appendChild(row);
  }
}

async function addPrompt(){
  const agentInput = $("qp-agent");
  const textArea = $("qp-text");
  const errEl = $("qp-error");
  if (!agentInput || !textArea) return;
  const showErr = (msg) => { if (errEl){ errEl.textContent = msg || ""; errEl.style.display = msg ? "block" : "none"; } };
  const agent = String(agentInput.value || "").trim();
  const text = String(textArea.value || "");
  if (!agent){ showErr("an agent is required"); return; }
  if (!text){ showErr("a prompt text is required"); return; }
  const d = await postModel("/api/queue/add", {agent: agent, text: text});
  if (d && d.ok === true){
    showErr("");
    textArea.value = "";   // clear the textarea on success and re-render from the returned queue
    renderQueue(d);
    refreshAgentDatalist();
  } else {
    showErr((d && d.error) ? d.error : "could not add the prompt");
  }
}

let QUEUE_PROMPTS = [];   // latest /api/queue prompts; shared by the queue pane and the Autopilot tab
let RUN_STATUS = {};      // repo -> {text, ok}: the last start result or error shown in that run row

function refreshAgentDatalist(){
  let dl = $("iris-agents");
  if (!dl){
    dl = document.createElement("datalist");
    dl.id = "iris-agents";
    document.body.appendChild(dl);
  }
  while (dl.firstChild) dl.removeChild(dl.firstChild);
  const seen = new Set();
  for (const p of QUEUE_PROMPTS){
    const a = String(p.agent || "").trim();
    if (!a || seen.has(a.toLowerCase())) continue;
    seen.add(a.toLowerCase());
    dl.appendChild(el("option", null, a));
  }
}

function readAgent(repo){
  try {
    const v = localStorage.getItem("iris.autopilot.agent." + repo);
    return (v && String(v).trim()) ? String(v) : "qwen";
  } catch (err) { return "qwen"; }
}
function writeAgent(repo, value){
  try { localStorage.setItem("iris.autopilot.agent." + repo, String(value || "")); } catch (err) {}
}
function agentHasPrompt(agent){
  const a = String(agent || "").trim().toLowerCase();
  if (!a) return false;
  for (const p of QUEUE_PROMPTS){
    if (String(p.agent || "").trim().toLowerCase() === a) return true;
  }
  return false;
}
function firstPromptTextFor(agent){
  const a = String(agent || "").trim().toLowerCase();
  if (!a) return "";
  for (const p of QUEUE_PROMPTS){
    if (String(p.agent || "").trim().toLowerCase() === a) return String(p.text || "");
  }
  return "";
}

    const row = el("div", "rrow");

    // agent input (remembered per repo) plus the Start next prompt button and last result
    const ctrl = el("span", "r-ctrl");
    const input = document.createElement("input");
    input.type = "text";
    input.className = "agent-input";
    input.setAttribute("list", "iris-agents");
    input.value = readAgent(r.repo);
    input.placeholder = "qwen";
    const btn = el("button", "btn-start", "Start next prompt");
    btn.type = "button";
    function refreshBtn(){
      const agent = String(input.value || "").trim();
      if (r.done === true && agentHasPrompt(agent)){
        btn.disabled = false;
        btn.title = "";
      } else {
        btn.disabled = true;
        btn.title = r.done !== true ? "run still has open items" : ("nothing queued for " + agent);
      }
    }
    input.addEventListener("input", refreshBtn);
    input.addEventListener("change", () => { writeAgent(r.repo, String(input.value || "").trim()); });
    btn.addEventListener("click", () => { startNextPrompt(r, input, btn); });
    refreshBtn();
    ctrl.appendChild(input);
    ctrl.appendChild(btn);
    const st = RUN_STATUS[r.repo];
    if (st){ ctrl.appendChild(el("span", "r-status" + (st.ok ? "" : " r-status-err"), st.text)); }
    row.appendChild(ctrl);
    const isDone = r.done === true;
    row.appendChild(el("span", "badge " + (isDone ? "o-ok" : "o-error"), isDone ? "done" : "running"));
    body.appendChild(row);
  }
}

async function loadRuns(){ renderRuns(await j("/api/runs")); }

async function startNextPrompt(run, input, btn){
  const agent = String(input.value || "").trim();
  if (!agent) return;
  const repo = run.repo || "";
  const text = firstPromptTextFor(agent);
  const ok = window.confirm("Start the next " + agent + " prompt in " + repo + "?\n\n" + text.slice(0, 300));
  if (!ok) return;
  btn.disabled = true;
  btn.textContent = "starting...";
  let statusText = "";
  let statusOk = false;
  try {
    const d = await postModel("/api/cline/start", {agent: agent, repo: repo});
    if (d && d.ok === true){
      statusText = String(d.result || "started");
      statusOk = true;
    } else {
      statusText = (d && d.error) ? String(d.error) : "start failed";
      statusOk = false;
    }
  } catch (err) {
    statusText = "start failed";
    statusOk = false;
  }
  RUN_STATUS[repo] = {text: statusText, ok: statusOk};
  btn.textContent = "Start next prompt";
  await Promise.all([loadQueue(), loadRuns()]);
}
let runsTimer = null;   // polls /api/runs every 10 s, only while the Autopilot tab is visible
function startRunsPolling(){
  if (runsTimer) return;
  loadRuns();
  runsTimer = setInterval(loadRuns, 10000);
}
function stopRunsPolling(){
  if (!runsTimer) return;
  clearInterval(runsTimer);
  runsTimer = null;
}

// --- done banner: tell Jay when a run finishes ---------------------------------
const NORMAL_TITLE = document.title;   // captured once so we can restore it after "(done)"
let RUNS_BASELINE = null;              // previous /api/runs done-state map; null before the first poll

function runsDoneMap(d){
  const m = {};
  if (d && Array.isArray(d.runs)){
    for (const r of d.runs){
      const key = String(r.repo || "") + "::" + String(r.name || "");
      m[key] = {done: r.done === true, name: String(r.name || ""), repo: String(r.repo || "")};
    }
  }
  return m;
}

function showDoneBanner(name){
  const banner = $("done-banner");
  if (!banner) return;
  const text = name + " is done. Start the next prompt?";
  const t = $("done-banner-text");
  if (t) t.textContent = text;
  banner.classList.add("show");
  document.title = "(done) " + NORMAL_TITLE;
  try {
    if ("Notification" in window && Notification.permission === "granted"){
      new Notification(text);   // same text as the banner, when notifications are allowed
    }
  } catch (err) {}
}

function closeDoneBanner(){
  const banner = $("done-banner");
  if (banner) banner.classList.remove("show");
  document.title = NORMAL_TITLE;   // restore the normal title once the banner is closed
}

async function pollRunsForDone(){
  const d = await j("/api/runs");
  const now = runsDoneMap(d);
  if (RUNS_BASELINE){   // the first poll only sets the baseline and never alerts
    for (const key of Object.keys(now)){
      const cur = now[key];
      const prev = RUNS_BASELINE[key];
      if (cur.done && prev && !prev.done) showDoneBanner(cur.name);   // not done -> done
    }
  }
  RUNS_BASELINE = now;
}

function wireNotifyMe(){
  const btn = $("notify-me");
  if (!btn) return;
  try {
    if ("Notification" in window && (Notification.permission === "granted" || Notification.permission === "denied")){
      btn.style.display = "none";   // already decided, no need to ask again
      return;
    }
  } catch (err) {}
  btn.addEventListener("click", async () => {
    try { if ("Notification" in window) await Notification.requestPermission(); } catch (err) {}
    let state = "default";
    try { if ("Notification" in window) state = Notification.permission; } catch (err) {}
    if (state === "granted" || state === "denied") btn.style.display = "none";   // hide once granted or denied
  });
}

(function wireDoneBanner(){
  const go = $("done-banner-go");
  if (go) go.addEventListener("click", () => showTab("queue"));   // switch to the Autopilot tab
  const close = $("done-banner-close");
  if (close) close.addEventListener("click", closeDoneBanner);
  wireNotifyMe();
  pollRunsForDone();          // first poll sets the baseline (never alerts)
  setInterval(pollRunsForDone, 30000);   // keep polling every 30 s even on other tabs
})();

const RENDERERS = {
  "/api/system": renderSystem,
  "/api/agents": renderAgents,
  "/api/lmstudio": renderLM,
  "/api/iris/model": renderIrisModel,
  "/api/journal": renderJournal,
  "/api/tools": renderTools,
  "/api/sessions": renderSessions,
  "/api/claude": renderClaude
};

async function tick(){
  const results = await Promise.all(Object.keys(RENDERERS).map(u => j(u)));
  Object.keys(RENDERERS).forEach((u, i) => RENDERERS[u](results[i]));
  const dot = $("pulse");
  const bad = results.some(r => !r || "error" in r);
  dot.classList.toggle("err", bad);
  $("updated").textContent = "updated " + new Date().toTimeString().slice(0, 8) + (bad ? " (some feeds down)" : "");
}

tick();
setInterval(tick, 3000);

// --- tabs ------------------------------------------------------------------------
const PANES = ["overview", "agents", "activity", "repos", "tools", "eval", "queue"];
function showTab(name){
  if (!PANES.includes(name)) name = "overview";
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  for (const p of PANES) $(p + "-pane").classList.toggle("hidden", p !== name);
  if (name === "eval") loadEval();   // the eval tab fetches when shown, not on every poll
  if (name === "queue"){ loadQueue(); startRunsPolling(); }   // queue tab: fetch when shown; runs keep polling while visible
  else stopRunsPolling();
}
document.querySelectorAll(".tab").forEach(b => { b.onclick = () => { location.hash = b.dataset.tab; }; });
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
showTab(location.hash.slice(1));

// --- queue: the add prompt form --------------------------------------------------
(function wireAddPrompt(){
  const form = $("add-prompt");
  if (!form) return;
  const textArea = $("qp-text");
  form.addEventListener("submit", (e) => { e.preventDefault(); addPrompt(); });
  if (textArea){
    textArea.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){   // Ctrl+Enter adds the prompt
        e.preventDefault();
        if (form.requestSubmit) form.requestSubmit(); else addPrompt();
      }
    });
  }
})();

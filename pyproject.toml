[project]
name = "iris"
dynamic = ["version"]
description = "A local voice agent that operates this Windows PC through UI Automation."
readme = "README.md"
authors = [{name = "skl"}]
license = {text = "MIT"}
keywords = ["voice agent", "ui automation", "local llm", "windows", "agents"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = ["pywinauto>=0.6.9", "psutil>=5.9"]

[project.scripts]
iris = "iris.__main__:main"

[project.urls]
Repository = "https://github.com/sklsp/Iris"

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy", "pyttsx3>=2.90", "openwakeword>=0.6"]
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]  # Word, PowerPoint and Excel files
tts = ["kokoro-onnx>=0.6"]  # optional Kokoro TTS (IRIS_TTS=kokoro); SAPI is the default and needs nothing
piper = ["piper-tts>=1.3"]  # natural Dutch and English voices (IRIS_TTS=piper); GPL, run as a separate program
browser = ["websocket-client>=1.7"]  # web pages in Brave, Chrome or Edge through the DevTools Protocol
app = ["pywebview>=6.2"]  # the desktop app: `iris app`, a window on Edge WebView2 plus a tray icon
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]  # Whisper large-v3-turbo on an NVIDIA GPU
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
packages = ["iris", "iris.dashboard"]

[tool.setuptools.package-data]
iris = ["tier_lock.json", "agents.toml", "assets/iris.ico"]
"iris.dashboard" = ["index.html"]

[tool.setuptools.dynamic]
version = {attr = "iris.__version__"}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "C4", "RET", "PERF", "PTH", "RUF"]
ignore = [
    "RUF001",  # Dutch text and typographic quotes in strings are intended
]

[tool.ruff.lint.per-file-ignores]
"iris/eval.py" = ["C416", "PERF401", "PERF403", "PTH123", "RUF005"]  # protected file; fix by hand
"iris/policy.py" = ["SIM112"]  # protected file; fix by hand
"iris/skills.py" = ["SIM105", "PTH105", "RUF100"]  # protected file; fix by hand
"installer/dlls.py" = ["PERF401"]  # protected file; fix by hand

[tool.mypy]
files = ["iris", "tests"]
exclude = ["tests/fixtures/"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["iris.policy", "iris.registry", "iris.eval"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# the protected modules stay as written; strict-only flags are off for them
module = ["iris.eval", "iris.policy", "iris.skills", "iris.registry"]
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
no_implicit_reexport = false
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
# annotating 2400 test functions is not the goal
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# not yet typed; each run removes some
module = [
    "tests.test_tier_lock",
    "tests.test_skills",
    "tests.test_policy",
    "tests.test_safety",
    "tests.test_agent",
    "tests.test_voice",
    "tests.test_app",
    "tests.test_desktop",
    "tests.test_overlay",
    "tests.test_voice_behaviour",
    "tests.test_packs",
    "tests.test_browser_branches",
    "tests.test_voice_branches",
    "tests.test_browser",
    "tests.test_tools_behaviour",
    "tests.test_dashboard",
    "tests.test_voxcpm",
    "tests.test_autopilot",
    "tests.test_tools",
    "tests.test_notes",
]
ignore_errors = true

[tool.pytest.ini_options]
# a deprecated call in Iris's own code fails now, not when a new Python removes it
filterwarnings = ["error::DeprecationWarning:iris", "error::PendingDeprecationWarning:iris"]

[tool.coverage.run]
source = ["iris"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 99
show_missing = true

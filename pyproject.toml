[project]
name = "iris"
dynamic = ["version"]
description = "A local voice agent that operates this Windows PC through UI Automation."
readme = "README.md"
authors = [{name = "skl"}]
license = {text = "MIT"}
keywords = ["voice agent", "ui automation", "local llm", "windows", "agents"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = ["pywinauto>=0.6.9", "psutil>=5.9"]

[project.scripts]
iris = "iris.__main__:main"

[project.urls]
Repository = "https://github.com/sklsp/Iris"

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy", "pyttsx3>=2.90", "openwakeword>=0.6"]
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]  # Word, PowerPoint and Excel files
tts = ["kokoro-onnx>=0.6"]  # optional Kokoro TTS (IRIS_TTS=kokoro); SAPI is the default and needs nothing
piper = ["piper-tts>=1.3"]  # natural Dutch and English voices (IRIS_TTS=piper); GPL, run as a separate program
browser = ["websocket-client>=1.7"]  # web pages in Brave, Chrome or Edge through the DevTools Protocol
app = ["pywebview>=6.2"]  # the desktop app: `iris app`, a window on Edge WebView2 plus a tray icon
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]  # Whisper large-v3-turbo on an NVIDIA GPU
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
packages = ["iris", "iris.dashboard"]

[tool.setuptools.package-data]
iris = ["tier_lock.json", "agents.toml", "assets/iris.ico"]
"iris.dashboard" = ["index.html"]

[tool.setuptools.dynamic]
version = {attr = "iris.__version__"}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["iris"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["iris.policy", "iris.registry", "iris.eval"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# a deprecated call in Iris's own code fails now, not when a new Python removes it
filterwarnings = ["error::DeprecationWarning:iris", "error::PendingDeprecationWarning:iris"]

[tool.coverage.run]
source = ["iris"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 99
show_missing = true
